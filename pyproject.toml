[project]
name = "procurement-lever-intelligence"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
